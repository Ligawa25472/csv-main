<div class="error-container">
  <div class="error-content">
    <div class="error-code">500</div>
    <h1 class="error-title">Server Error</h1>
    <p class="error-description">
      Something went wrong on our end. Our team has been notified and is working to fix it. Please try again later.
    </p>
    
    <div class="error-actions">
      <a routerLink="/home" class="btn btn-primary">
        Go to Homepage
      </a>
      <a routerLink="/contact" class="btn btn-secondary">
        Report Issue
      </a>
    </div>

    <div class="error-info">
      <p class="text-muted">
        Error Code: <span class="code">500 Internal Server Error</span>
      </p>
      <p class="text-muted" style="margin-top: 0.5rem;">
        Please try refreshing the page or contact us if the problem persists.
      </p>
    </div>
  </div>
</div>
