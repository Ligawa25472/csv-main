<!-- Floating QR Code Widget -->
<div class="floating-qr-container" [class.expanded]="isExpanded()">
  <!-- QR Code Card -->
  <div class="qr-card" [class.visible]="isExpanded()">
    <button class="qr-close" (click)="closeQr()" aria-label="Close QR code">×</button>
    <div class="qr-header">
      <h3>Contact Us on WhatsApp</h3>
      <p>Scan to reach us instantly</p>
    </div>
    <div class="qr-image-container">
      <img 
        src="https://s7nje1ay02rvfkep.public.blob.vercel-storage.com/mna%20qr.jpeg" 
        alt="WhatsApp QR Code - Scan to contact MNA Accounting" 
        class="qr-image"
      />
    </div>
    <p class="qr-instructions">Use your phone camera or WhatsApp to scan</p>
  </div>

  <!-- Floating Button -->
  <button 
    class="qr-toggle-btn" 
    (click)="toggleQr()"
    [attr.aria-expanded]="isExpanded()"
    aria-label="Open WhatsApp QR code"
    title="Scan to contact us on WhatsApp"
  >
    <svg class="qr-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <!-- WhatsApp Icon -->
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a9.87 9.87 0 00-9.746 9.798c0 2.734.732 5.405 2.124 7.721L1.464 23.139l8.169-2.14c2.25 1.228 4.786 1.874 7.297 1.874 5.385 0 9.747-4.363 9.747-9.747 0-2.605-.997-5.054-2.809-6.883-1.812-1.828-4.237-2.834-6.783-2.834z"/>
    </svg>
    <span class="qr-label">WhatsApp</span>
  </button>

  <!-- Pulse Animation Indicator -->
  <div class="qr-pulse"></div>
</div>
